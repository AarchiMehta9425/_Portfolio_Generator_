    <script>
        function generatePDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: "portrait",
                unit: "mm",
                format: "a4",
            });

            const sections = document.querySelectorAll("section"); // Select all sections
            let yOffset = 10; // Initial Y position

            function captureSection(section, callback) {
                html2canvas(section, { scale: 2, useCORS: true, allowTaint: true })
                    .then((canvas) => {
                        const imgData = canvas.toDataURL("image/png");
                        const imgWidth = 190; // Adjusted for A4
                        const imgHeight = (canvas.height * imgWidth) / canvas.width;

                        if (yOffset + imgHeight > 280) {
                            pdf.addPage(); // Add new page if needed
                            yOffset = 10; // Reset yOffset
                        }

                        pdf.addImage(imgData, "PNG", 10, yOffset, imgWidth, imgHeight);
                        yOffset += imgHeight + 10;

                        callback();
                    });
            }

            function processSections(index) {
                if (index < sections.length) {
                    captureSection(sections[index], () => processSections(index + 1));
                } else {
                    pdf.save("portfolio.pdf");
                }
            }

            // Ensure all images & fonts load before generating PDF
            setTimeout(() => {
                processSections(0);
            }, 1000);
        }

        // Add "Download PDF" button
        const pdfButton = document.createElement("button");
        pdfButton.textContent = "Download PDF";
        pdfButton.style.position = "fixed";
        pdfButton.style.bottom = "20px";
        pdfButton.style.right = "20px";
        pdfButton.style.padding = "10px 20px";
        pdfButton.style.backgroundColor = "#007BFF";
        pdfButton.style.color = "#FFF";
        pdfButton.style.border = "none";
        pdfButton.style.borderRadius = "5px";
        pdfButton.style.cursor = "pointer";
        pdfButton.onclick = generatePDF;

        document.body.appendChild(pdfButton);



        // Dynamically update the visible span when user types
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.placeholder = "Ex. Aarchi Mehta";
        nameInput.style.display = "block";
        nameInput.style.marginTop = "10px";
        nameInput.style.fontSize = "18px";
        nameInput.style.padding = "8px";
        nameInput.style.border = "1px solid #ccc";
        nameInput.style.borderRadius = "5px";
        nameInput.style.width = "250px";

        document.querySelector(".userinputwrapper").appendChild(nameInput);

        const nameDisplay = document.getElementById("username");

        nameInput.addEventListener("input", () => {
            nameDisplay.textContent = nameInput.value || "Aarchi Mehta";
        });
